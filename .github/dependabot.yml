version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: build
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: npm
    directory: /examples/clicker
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      prefix-development: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
