name: Docs

# Builds the documentation site on every change as a check. Deploying to GitHub Pages is
# manual (Run workflow) and requires Pages to be enabled with the "GitHub Actions" source.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'packages/**', 'typedoc.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'packages/**', 'typedoc.json', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_BASE: /portoJS/
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
