name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch the API you would like to use.
      render: ts
  - type: dropdown
    id: layer
    attributes:
      label: Where does it belong?
      description: The core stays game-agnostic; game-specific mechanics are plugins.
      options: [Core (time, ticks, saves, offline), Mechanics plugin, New plugin, Docs, Not sure]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
